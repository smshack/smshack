name: 외주 · 기술자문 문의
description: 인프라 구축, CI/CD, WebRTC, 폐쇄망 관련 일을 맡기고 싶으시면 여기에 남겨주세요.
title: "[문의] "
labels: ["문의"]
body:
  - type: markdown
    attributes:
      value: |
        아직 정리가 안 된 상태여도 괜찮습니다. **지금 막혀 있는 것 한 줄**만 있어도 답변드립니다.
        비공개로 이야기하고 싶으시면 5432tat@naver.com 으로 바로 메일 주셔도 됩니다.

  - type: checkboxes
    id: 분야
    attributes:
      label: 어떤 일인가요
      description: 해당되는 것을 모두 골라주세요. 애매하면 비워두셔도 됩니다.
      options:
        - label: 폐쇄망 · 망분리 환경 구축 (오프라인 레지스트리, 사설 CA, 반출입 구조)
        - label: WebRTC 실시간 통신 인프라 (TURN/STUN, Coturn, 미디어 서버)
        - label: GitLab · CI/CD 구축 또는 이관 (GitLab CE, Runner, Jenkins, ArgoCD)
        - label: 쿠버네티스 환경 구축 (온프렘, 클라우드, 마이그레이션)
        - label: 모니터링 · 관측 스택 (Prometheus, Grafana, Thanos)
        - label: 서버 · 인프라 운영 / 장애 분석
        - label: 웹 서비스 개발 (기획부터 배포까지)

  - type: dropdown
    id: 환경
    attributes:
      label: 어떤 환경인가요
      options:
        - 온프렘 (자체 서버실 / IDC)
        - 클라우드 (AWS / Azure / GCP / NCP)
        - 폐쇄망 · 망분리
        - 온프렘 + 클라우드 혼합
        - 아직 정해지지 않았습니다
    validations:
      required: true

  - type: textarea
    id: 상황
    attributes:
      label: 지금 막혀 있는 지점
      description: |
        해보려다 안 되는 것, 또는 하고 싶은데 어디서 시작할지 모르겠는 것.
        에러 메시지나 로그가 있으면 그대로 붙여주셔도 좋습니다.
      placeholder: |
        예) 폐쇄망에 K8s를 올려야 하는데 이미지 반입 절차를 어떻게 잡아야 할지 모르겠습니다.
        예) WebRTC가 사내망에서만 연결이 안 됩니다. TURN을 붙였는데도 ICE가 실패합니다.
    validations:
      required: true

  - type: dropdown
    id: 기간
    attributes:
      label: 예상 기간
      options:
        - 단발성 자문 (1~2회 미팅)
        - 1개월 이내
        - 1~3개월
        - 3개월 이상
        - 아직 모르겠습니다
    validations:
      required: false

  - type: input
    id: 연락처
    attributes:
      label: 연락받을 곳
      description: 이메일이나 편한 연락 수단을 남겨주세요. 이슈 댓글로 받으셔도 됩니다.
      placeholder: 이메일 또는 "이슈 댓글로 주세요"
    validations:
      required: false
