name: Build README

on:
  push:
    branches: [main]
  schedule:
    # 매일 09:00 KST (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

# 두 실행이 겹치면 나중 것의 push 가 거부된다. 한 번에 하나만 돌린다.
concurrency:
  group: build-readme
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: README 갱신
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build_readme.py

      - name: 변경분 커밋
        run: |
          git config user.name "서명석"
          git config user.email "46982752+smshack@users.noreply.github.com"
          if git diff --quiet README.md; then
            echo "변경 없음 — 커밋 생략"
            exit 0
          fi
          git add README.md
          git commit -m "chore: README 자동 갱신 [skip ci]"
          for i in 1 2 3; do
            git push && exit 0
            echo "push 거부됨 — rebase 후 재시도 ($i/3)"
            git pull --rebase --autostash origin main
          done
          echo "3회 시도 후에도 실패"
          exit 1
